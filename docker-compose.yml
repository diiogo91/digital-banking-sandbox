services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bankdemo
      POSTGRES_USER: bankdemo
      POSTGRES_PASSWORD: bankdemo
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankdemo"]
      interval: 5s
      retries: 10
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/bankdemo
      DB_USER: bankdemo
      DB_PASSWORD: bankdemo
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
